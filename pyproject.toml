[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csp-solver"
version = "0.1.0"
description = "Generic constraint satisfaction solver with human-readable reasoning"
authors = [{name = "Otto Perdeck"}]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
]

[project.scripts]
csp = "csp.cli:main"
puzzle-lab = "csp.puzzle_lab:main"

[project.optional-dependencies]
svg = [
    "fonttools>=4.50",
]
png = [
    "fonttools>=4.50",
    "resvg-py>=0.5",
]
docx = [
    "fonttools>=4.50",
    "resvg-py>=0.5",
    "python-docx>=1.1",
]
scan = [
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13 ; sys_platform != 'darwin'",
    "pyobjc-framework-Vision>=10.3 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pillow>=10.1",
    "python-docx>=1.1",
    "fonttools>=4.50",
    "resvg-py>=0.5",
    "opencv-python-headless>=4.10",
]

[tool.setuptools.package-data]
csp = ["assets/*", "assets/*/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["fontTools.*", "resvg_py", "Vision", "Foundation", "pytesseract", "cv2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not solutions and not booklet'"
markers = [
    "solutions: puzzle-family solver tests and exhaustive published-puzzle checks",
    "booklet: generate and check the complete booklet from all published puzzles",
]
