name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-cleaner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/cleanup_merged_branches.test.js

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uvx ruff check src tests benchmark
      - run: uvx ruff format --check src tests benchmark
      - run: uv run mypy src
      - run: uv run pytest -v --override-ini=addopts= --shard=${{ matrix.shard }}/8 -k 'not test_full_booklet_generates_for_every_published_puzzle' --tb=short --durations=20

  full-booklet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest -v --override-ini=addopts= tests/test_docx.py::test_full_booklet_generates_for_every_published_puzzle --tb=short --durations=20

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
